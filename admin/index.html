<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Painel GLC RR</title>
  <meta name="theme-color" content="#12263A">
  <link rel="icon" type="image/png" href="../assets/icons/GLCRR-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css?v=20261019.5">
  <link rel="stylesheet" href="admin.css?v=20261019.5">
</head>
<body class="adm">
  <header class="adm-head">
    <div class="wrap adm-bar">
      <a class="brand" href="#inicio">
        <span class="logo logo-top"><span class="badge" aria-hidden="true"></span><img src="../assets/icons/GLCRR-logo.png" alt=""></span>
        <div><b>Painel GLC RR</b><small>Área dos organizadores</small></div>
      </a>
      <div class="adm-sessao" id="sessao" hidden>
        <span class="adm-quem" id="quem"></span>
        <button class="btn btn-sm adm-sair" type="button" id="sair">Sair</button>
      </div>
    </div>
    <nav class="wrap adm-nav" id="nav" aria-label="Seções do painel" hidden></nav>
  </header>

  <main class="wrap adm-main" id="tela">
    <section class="adm-login" id="tela-login" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Entrar</h1>
      <p class="lead">Use o usuário e a senha que você cadastrou no gerador de acesso.</p>
      <form class="adm-form" id="form-login" novalidate>
        <label class="campo">
          <span>Usuário</span>
          <input name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="campo">
          <span>Senha</span>
          <input name="senha" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-ouro adm-btn" type="submit">Entrar</button>
        <p class="adm-msg" id="msg-login" role="status" aria-live="polite"></p>
      </form>
      <p class="adm-nota">A sessão termina ao fechar a aba. Primeiro acesso? Gere seu registro em <a href="gerar-acesso.html">gerar-acesso.html</a>.</p>
    </section>
  </main>

  <noscript><p class="wrap">O painel precisa de JavaScript ativado.</p></noscript>

  <script src="../assets/js/data.js?v=20261019.5"></script>
  <script src="cripto.js?v=20261019.5"></script>
  <script src="github.js?v=20261019.5"></script>
  <script src="imagens.js?v=20261019.5"></script>
  <script src="regras-jogadores.js?v=20261019.5"></script>
  <script src="regras-eventos.js?v=20261019.5"></script>
  <script src="tela-jogadores.js?v=20261019.5"></script>
  <script src="tela-eventos.js?v=20261019.5"></script>
  <script src="regras-suico.js?v=20261019.5"></script>
  <script src="tela-resultados.js?v=20261019.5"></script>
  <script src="tela-suico.js?v=20261019.5"></script>
  <script src="admin.js?v=20261019.5"></script>
</body>
</html>
